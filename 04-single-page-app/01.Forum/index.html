<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css?family=Parisienne&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/3cd69e2433.js" crossorigin="anonymous"></script>
    <script type="module" src="src/app.js"></script>
    <title>SoftUni Forum</title>
</head>

<body>

    <header>
        <div class="mini-navbar-wrap">
            <div class="logo-wrap">
                <img src="./static/logo.webp" alt="logo">
                <p class="logo"><span class="logo">SoftUni Forum</span></p>
            </div>
            <div class="mini-navbar">

            </div>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="#" id="home-link">Home</a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- ===== HOME VIEW ===== -->
    <div class="container" id="home-view">
        <main>
            <div class="new-topic-border">
                <div class="header-background">
                    <span>New Topic</span>
                </div>
                <form id="topic-form">
                    <div class="new-topic-title">
                        <label for="topicName">Title <span class="red">*</span></label>
                        <input type="text" name="topicName" id="topicName">
                    </div>
                    <div class="new-topic-title">
                        <label for="username">Username <span class="red">*</span></label>
                        <input type="text" name="username" id="username">
                    </div>
                    <div class="new-topic-content">
                        <label for="postText">Post <span class="red">*</span></label>
                        <textarea name="postText" id="postText" rows="8" class="height"></textarea>
                    </div>
                    <div class="new-topic-buttons">
                        <button class="cancel">Cancel</button>
                        <button class="public">Post</button>
                    </div>
                </form>
            </div>

            <div class="topic-title">
                <!-- тук JS ще рендерира темите -->
                <div class="topic-container">

                </div>
            </div>
        </main>
    </div>

    <!-- ===== DETAILS VIEW ===== -->
    <div class="container" id="details-view" style="display: none;">
        <div class="theme-content">
            <div class="theme-title">
                <div class="theme-name-wrapper">
                    <div class="theme-name">
                        <!-- тук JS ще сложи заглавието на темата -->
                        <h2></h2>
                    </div>
                </div>
            </div>

            <!-- тук JS ще рендерира поста и коментарите -->
            <div class="comment">

            </div>

            <div class="answer-comment">
                <p><span>currentUser</span> comment:</p>
                <div class="answer">
                    <form id="comment-form">
                        <textarea name="postText" id="comment" cols="30" rows="10"></textarea>
                        <div>
                            <label for="comment-username">Username <span class="red">*</span></label>
                            <input type="text" name="username" id="comment-username">
                        </div>
                        <button>Post</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>This site is designed to be used for training purposes at SoftUni.</p>
    </footer>
</body>

</html>
